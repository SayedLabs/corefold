name: Net probe
on:
  push:
    branches: [claude/project-thread-8ka2o9]
    paths: [scripts/netprobe2.py, scripts/netprobe.py, .github/workflows/netprobe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - shell: pwsh
        run: python -m pip install --quiet winrt-runtime winrt-Windows.Foundation winrt-Windows.Foundation.Collections winrt-Windows.Networking.Connectivity winrt-Windows.Networking
      - name: some traffic first
        shell: pwsh
        run: curl.exe -s -o NUL https://speed.cloudflare.com/__down?bytes=20000000
      - name: probe as admin
        shell: pwsh
        run: python scripts/netprobe2.py
      - name: probe as basic user
        shell: pwsh
        run: |
          $py = (Get-Command python).Source
          $out = "$env:TEMP\basic.txt"
          runas /trustlevel:0x20000 "cmd /c `"$py`" $pwd\scripts\netprobe2.py > $out 2>&1"
          Start-Sleep 20
          Get-Content $out
