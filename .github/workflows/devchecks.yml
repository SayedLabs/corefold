# The developer tools on a real Windows PC: Ruff looks for mistakes in the code and pytest (with
# pytest-qt) clicks the design system's widgets. Both must pass; Ruff's findings also show next to
# the lines in a pull request. Known holes in the packages are looked for by the Security checks
# (security.yml), not here.
name: Developer checks

on:
  push:
    paths:
      - "**.py"
      - pyproject.toml
      - requirements.txt
      - requirements-dev.txt
      - .github/workflows/devchecks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the app and the developer tools
        shell: pwsh
        run: python -m pip install --quiet -r requirements-dev.txt

      - name: Ruff
        shell: pwsh
        run: |
          python -m ruff --version
          python -m ruff check --output-format github .

      - name: Tests (pytest-qt)
        if: always()
        shell: pwsh
        run: |
          # (Windows' 7-Zip, so the archive tests run here too; -rs names any test that was skipped)
          $env:PATH = "$env:ProgramFiles\7-Zip;$env:PATH"
          python -m pytest -rs
