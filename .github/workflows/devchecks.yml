# The developer tools on a real Windows PC: Ruff looks for mistakes in the code and pytest (with
# pytest-qt) clicks the design system's widgets. Ruff only reports for now (its findings show on the
# run's page and next to the lines in a pull request); the tests must pass. Known holes in the
# packages are looked for by the Security checks (security.yml), not here.
name: Developer checks

on:
  push:
    paths:
      - "**.py"
      - pyproject.toml
      - requirements.txt
      - requirements-dev.txt
      - .github/workflows/devchecks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the app and the developer tools
        shell: pwsh
        run: python -m pip install --quiet -r requirements-dev.txt

      - name: Ruff (reports only)
        shell: pwsh
        run: |
          python -m ruff --version
          python -m ruff check --output-format github --exit-zero .
          "## Ruff" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          python -m ruff check --statistics --exit-zero . | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: Tests (pytest-qt)
        if: always()
        shell: pwsh
        run: python -m pytest
