name: PDF editor diag (temporary)
on:
  push:
    branches: [claude/project-thread-aenm59]
    paths: [".github/workflows/pdfedit-diag.yml", "scripts/pdfedit_diag.py"]
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - shell: pwsh
        run: |
          python -m pip install --quiet -r requirements.txt
          python scripts/pdfedit_diag.py
