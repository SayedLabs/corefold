# Temporary: checks and screenshots of the new look on every push to this branch (removed before merging).
name: UI run

on:
  push:
    branches: [claude/project-thread-5gx15d]

permissions:
  contents: write

concurrency:
  group: ui-run
  cancel-in-progress: true

jobs:
  ui:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install what the app needs
        shell: pwsh
        run: |
          python -m pip install --quiet -r requirements.txt
          choco install ffmpeg -y --no-progress | Out-Null
          New-Item -ItemType Directory -Force shots | Out-Null
      - name: Translations
        shell: pwsh
        continue-on-error: true
        run: python scripts/check_translations.py *> shots/translations.txt
      - name: Click through the tools
        timeout-minutes: 10
        shell: pwsh
        continue-on-error: true
        run: |
          $env:PATH = "$env:ProgramFiles\7-Zip;$env:PATH"
          python scripts/uitest.py shots *> shots/uitest-output.txt
      - name: Take the pictures
        shell: pwsh
        continue-on-error: true
        run: |
          foreach ($combo in @("dark en", "light en", "dark ar", "light ar")) {
            $a = $combo -split " "
            python scripts/screenshots.py shots $a[0] $a[1] *>> "shots/output.txt"
          }
      - name: Save to the ui-shots branch
        if: always()
        shell: pwsh
        run: |
          Set-Location shots
          git init -q -b ui-shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "UI shots of $env:GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ui-shots
