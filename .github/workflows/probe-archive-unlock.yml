# Temporary: pre-launch probe for Archive and Unlock (removed before merging).
name: Probe archive and unlock
on:
  push:
    branches: [claude/project-thread-o1aq71]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        shell: pwsh
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: 7-Zip versions
        shell: pwsh
        continue-on-error: true
        run: |
          (Get-Item "$env:ProgramFiles\7-Zip\7z.exe").VersionInfo.ProductVersion
          choco search 7zip --exact --limit-output
          winget show --id 7zip.7zip -e --accept-source-agreements | Select-String Version
          $r = Invoke-WebRequest "https://www.7-zip.org/a/7z2605-x64.exe" -Method Head -UseBasicParsing
          "7-zip.org 26.05 installer: $($r.StatusCode) $($r.Headers['Content-Length'])"
      - name: Probe
        shell: pwsh
        run: |
          $env:PATH = "$env:ProgramFiles\7-Zip;$env:PATH"
          python scripts/probe_unlock.py
