# Measures how light Corefold is on a real Windows PC (one of GitHub's), without publishing anything.
# Run it by hand: Actions tab -> "Measure memory and CPU" -> Run workflow. The numbers appear on the
# run's summary page and on the "measure" branch (replaced on every run; it isn't part of the app).
name: Measure memory and CPU

on:
  workflow_dispatch:

permissions:
  contents: write   # the numbers are saved to the "measure" branch

jobs:
  measure:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the app
        shell: pwsh
        run: ./scripts/build.ps1 -Version 0.0.${{ github.run_number }}-measure

      - name: What start-up loads
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force measure | Out-Null
          & .venv\Scripts\python.exe -X importtime -c "import corefold.app" 2> measure/importtime.txt
          & .venv\Scripts\python.exe -c "import sys, corefold.app; print('\n'.join(sorted(sys.modules)))" > measure/modules.txt

      - name: Measure
        shell: pwsh
        run: |
          ./scripts/measure.ps1 measure/results.md
          Get-Content measure/results.md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Save the numbers to the measure branch
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force measure | Out-Null
          Set-Location measure
          git init -q -b measure
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Measured $env:GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" measure
