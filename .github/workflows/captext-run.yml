# TEMPORARY (delete before merging): tries Capture's "Select text" on real Windows on every push to this
# branch. Results go to the "captext-results" branch (summary.txt on top).
name: Capture select text

on:
  push:
    branches: [claude/project-thread-6l62do]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: captext-${{ github.ref }}
  cancel-in-progress: true

jobs:
  try:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: english-only
          - name: arabic-too
            arabic: "add"
          - name: arabic-first
            arabic: "first"
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install what the app needs
        shell: pwsh
        run: |
          python -m pip install --quiet -r requirements.txt
          New-Item -ItemType Directory -Force out | Out-Null
          python scripts/screenres.py 1920 1080 *>> out/screen.txt

      - name: Arabic text reading
        if: matrix.arabic != ''
        shell: pwsh
        continue-on-error: true
        env:
          HOW: ${{ matrix.arabic }}
        run: |
          Add-WindowsCapability -Online -Name "Language.OCR~~~ar-SA~0.0.1.0" *>> out/arabic-ocr.txt
          if ($env:HOW -eq "first") {
            Set-WinUserLanguageList -LanguageList ar-SA, en-US -Force *>> out/arabic-ocr.txt
          }
          Get-WinUserLanguageList *>> out/arabic-ocr.txt

      - name: Translations, Select text, older Capture checks
        shell: pwsh
        continue-on-error: true
        run: |
          python scripts/check_translations.py *> out/translations.txt
          python scripts/captexttest.py out/captext en dark *> out/captext-en.txt
          python scripts/captexttest.py out/captext ar light *> out/captext-ar.txt
          choco install ffmpeg -y --no-progress | Out-Null
          $env:PATH = "$env:ProgramFiles\7-Zip;$env:PATH"
          python scripts/featuretest.py *> out/featuretest.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: captext-${{ matrix.name }}
          path: out/

  results:
    needs: try
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: results

      - name: Sum up and save to the captext-results branch
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd results
          {
            echo "Select text run of $SHA"
            for d in */; do
              echo "== ${d%/}"
              grep -rhaE "^(captexttest|featuretest)[^:]*: [0-9]+ problem|problems? found|^\[(ar|fr|es|tr)\]" "$d" 2>/dev/null | head -20
              grep -rhaE "^(FAIL|ERROR|note) " "$d" 2>/dev/null | head -60
            done
          } > summary.txt
          cat summary.txt
          git init -q -b captext-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Select text run of $SHA"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" captext-results
