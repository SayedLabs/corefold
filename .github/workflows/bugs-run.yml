# Temporary: runs the click-through checks on every push to this branch (removed before merging).
name: Bugs run

on:
  push:
    branches: [claude/project-thread-ti0cxn]

permissions:
  contents: write

jobs:
  run:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        shell: pwsh
        run: python -m pip install --quiet -r requirements.txt
      - name: Click through
        timeout-minutes: 25
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $env:PATH = "$env:ProgramFiles\7-Zip;$env:PATH"
          python scripts/navtest.py out en dark *>> out/navtest-en-dark.txt
          python scripts/navtest.py out ar light *>> out/navtest-ar-light.txt
      - name: Save results
        if: always()
        shell: pwsh
        run: |
          Set-Location out
          git init -q -b bugs-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Results of $env:GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" bugs-results
