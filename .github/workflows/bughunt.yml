# Tries everything in the app on real Windows PCs (GitHub's), on every push to "next" and by hand:
# every page and button in several languages, looks, window sizes and screen scales, the first start, an
# upgrade from 1.7.5, the built Corefold.exe, and the older checks. What it found is on the
# "bughunt-results" branch (replaced on every run; it isn't part of the app; a run by hand on another branch saves to
# "bughunt-results-<branch>"), with summary.txt on top.
name: Bug hunt

on:
  push:
    branches: [next]
  workflow_dispatch:

permissions:
  contents: write   # the results are saved to the "bughunt-results" branch

concurrency:
  group: bughunt-${{ github.ref }}
  cancel-in-progress: false   # three people push to next: each push is tried, newest waiting runs replace older ones

jobs:
  try:
    runs-on: windows-latest
    timeout-minutes: 70   # (the two full sweeps, every page, button and search entry, take 30-45 minutes)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: checks
          - name: en-dark
            sweep: "--lang en --look dark"
          - name: ar-light
            sweep: "--lang ar --look light"
          - name: fr-dark-small
            sweep: "--lang fr --look dark --size min --quick"
          - name: es-light-max-150
            sweep: "--lang es --look light --size max --quick"
            scale: "1.5"
          - name: tr-dark-small-125
            sweep: "--lang tr --look dark --size min --quick"
            scale: "1.25"
          - name: ar-dark-200
            sweep: "--lang ar --look dark --size max --quick"
            scale: "2"
          - name: leak
            sweep: "--lang en --look dark --quick --only store,reopen --rounds 10"
          - name: leak-200
            sweep: "--lang ar --look light --quick --only store,reopen --rounds 10"
            scale: "2"
          - name: first-run
            sweep: "--lang en --look light --first-run --quick"
          - name: upgrade
            upgrade: "v1.7.5"
          - name: navtest
          - name: pdf
          - name: use-en-dark
            use: "--lang en --look dark"
          - name: use-ar-light
            use: "--lang ar --look light"
          - name: languages
          - name: newtests
          - name: exe
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install what the app needs
        shell: pwsh
        run: |
          python -m pip install --quiet -r requirements.txt
          New-Item -ItemType Directory -Force out | Out-Null
          python scripts/screenres.py 1920 1080 *>> out/screen.txt

      - name: Older checks (translations, archives and video, the Uninstaller, a very big archive, the newer tools)
        if: matrix.name == 'checks'
        shell: pwsh
        continue-on-error: true
        run: |
          choco install ffmpeg -y --no-progress | Out-Null
          $env:PATH = "$env:ProgramFiles\7-Zip;$env:PATH"
          python scripts/check_translations.py *> out/translations.txt
          python scripts/selftest.py *> out/selftest.txt
          foreach ($part in "kinds", "listing", "window", "leftovers") { python scripts/uninstalltest.py $part *>> out/uninstalltest.txt }
          python scripts/stress.py out/stress *> out/stress.txt
          python scripts/uitest.py out/uitest *> out/uitest.txt
          python scripts/featuretest.py *> out/featuretest.txt
          python scripts/captexttest.py out/captext en dark *> out/captexttest.txt
          python scripts/capfoldertest.py out/capfolder en dark *> out/capfoldertest-en.txt
          python scripts/capfoldertest.py out/capfolder ar light *> out/capfoldertest-ar.txt

      - name: Every page and button
        if: matrix.sweep != ''
        timeout-minutes: 55
        shell: pwsh
        continue-on-error: true
        env:
          SWEEP: ${{ matrix.sweep }}
          QT_SCALE_FACTOR: ${{ matrix.scale }}
        run: |
          if (-not $env:QT_SCALE_FACTOR) { Remove-Item Env:QT_SCALE_FACTOR }
          $env:PATH = "$env:ProgramFiles\7-Zip;$env:PATH"
          python scripts/sweeptest.py out/sweep @($env:SWEEP -split " ") *> out/sweep.txt

      - name: Upgrade from an older version
        if: matrix.upgrade != ''
        timeout-minutes: 30
        shell: pwsh
        continue-on-error: true
        env:
          OLD: ${{ matrix.upgrade }}
        run: |
          git worktree add -f old $env:OLD
          python scripts/upgradeseed.py old updata *> out/upgradeseed.txt
          python scripts/sweeptest.py out/sweep --keep updata --quick *> out/sweep.txt
          Copy-Item -Recurse updata/roaming out/upgrade-data -ErrorAction SilentlyContinue

      - name: Corefold PDF, every tool and its page
        if: matrix.name == 'pdf'
        timeout-minutes: 20
        shell: pwsh
        continue-on-error: true
        run: |
          python scripts/pdftest.py out/pdftest en dark *> out/pdftest-en.txt
          python scripts/pdftest.py out/pdftest ar light *> out/pdftest-ar.txt

      - name: Click through the window like a person
        if: matrix.name == 'navtest'
        timeout-minutes: 30
        shell: pwsh
        continue-on-error: true
        run: |
          python scripts/navtest.py out/navtest en dark *> out/navtest-en.txt
          python scripts/navtest.py out/navtest ar light *> out/navtest-ar.txt
          if (Test-Path scripts/quicktest.py) {
            python scripts/quicktest.py out/quicktest en dark *> out/quicktest-en.txt
            python scripts/quicktest.py out/quicktest ar light *> out/quicktest-ar.txt
          }

      - name: Every tool with real-size files, timed (freezes listed with where they come from)
        if: matrix.use != ''
        timeout-minutes: 45
        shell: pwsh
        continue-on-error: true
        env:
          USE: ${{ matrix.use }}
        run: |
          choco install ffmpeg -y --no-progress | Out-Null
          $env:PATH = "$env:ProgramFiles\7-Zip;$env:PATH"
          python scripts/usetest.py out/usetest @($env:USE -split " ") *> out/usetest.txt

      - name: Languages (the first start's language page, changing it with no restart, dropdowns)
        if: matrix.name == 'languages'
        timeout-minutes: 20
        shell: pwsh
        continue-on-error: true
        run: |
          python scripts/langtest.py out/langtest --look dark *> out/langtest-dark.txt
          python scripts/langtest.py out/langtest --look light *> out/langtest-light.txt
          python scripts/langtest.py out/langtest --start first --data startdata *> out/langtest-first.txt
          python scripts/langtest.py out/langtest --start again --data startdata *> out/langtest-again.txt

      - name: The 1.8 tools' own tests (Awake, Colors, Unlock, quick menu and search, Quick look, empty folders, settings in a file)
        if: matrix.name == 'newtests'
        timeout-minutes: 40
        shell: pwsh
        continue-on-error: true
        run: |
          foreach ($t in Get-ChildItem scripts -Filter "newtest_*.py") {
            python $t.FullName *> "out/$($t.BaseName).txt"
          }

      - name: The built Corefold.exe
        if: matrix.name == 'exe'
        timeout-minutes: 30
        shell: pwsh
        continue-on-error: true
        run: |
          ./scripts/build.ps1 -Version 0.0.${{ github.run_number }}-bughunt *> out/build.txt
          python -m pip install --quiet pywinauto
          $exe = Get-ChildItem -Recurse dist -Filter Corefold.exe | Select-Object -First 1
          python scripts/exetest.py $exe.FullName out/exetest *> out/exetest.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bughunt-${{ matrix.name }}
          path: out/

  results:
    needs: try
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: results

      - name: Sum up and save to the bughunt-results branch
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # a run started by hand on another branch keeps its results apart from next's
          OUT: ${{ github.ref_name == 'next' && 'bughunt-results' || format('bughunt-results-{0}', github.ref_name) }}
        run: |
          cd results
          {
            echo "Bug hunt of $SHA"
            for d in */; do
              echo "== ${d%/}"
              grep -rhaE "^(sweeptest|navtest|exetest|uitest|selftest|stress|quicktest|usetest|featuretest|pdftest|langtest|captexttest|capfoldertest|newtest_[a-z]+)[^:]*: [0-9]+ problem|problems? found|^[0-9]+ problem|unused" "$d" 2>/dev/null | head -20
              grep -rhaE "^(FAIL|ERROR|SLOW) " "$d" 2>/dev/null | sort | uniq -c | sort -rn | head -60
            done
          } > summary.txt
          cat summary.txt
          git init -q -b "$OUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Bug hunt of $SHA"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "$OUT"
