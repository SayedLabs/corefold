# TEMPORARY (delete before merging): builds the app on every push to this branch and lists what
# takes the space, then runs the built-exe checks. Results go to the "size-results" branch.
name: Size run

on:
  push:
    branches: [claude/project-thread-0fzic9]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: size-run
  cancel-in-progress: true

jobs:
  size:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          ./scripts/build.ps1 -Version 0.0.${{ github.run_number }}-size *> out/build.txt
          if ($LASTEXITCODE) { Get-Content out/build.txt -Tail 60; exit 1 }

      - name: What takes the space
        if: always()
        shell: pwsh
        run: |
          & .venv\Scripts\python.exe scripts/sizereport.py dist\Corefold dist\release *> out/size.txt
          Get-Content out/size.txt -TotalCount 80

      - name: The built Corefold.exe
        timeout-minutes: 30
        shell: pwsh
        continue-on-error: true
        run: |
          & .venv\Scripts\python.exe -m pip install --quiet pywinauto
          $exe = Get-ChildItem -Recurse dist -Filter Corefold.exe | Select-Object -First 1
          & .venv\Scripts\python.exe scripts/exetest.py $exe.FullName out/exetest *> out/exetest.txt
          Get-Content out/exetest.txt -Tail 40

      - name: Save to the size-results branch
        if: always()
        shell: pwsh
        run: |
          Set-Location out
          git init -q -b size-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Size of $env:GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" size-results
