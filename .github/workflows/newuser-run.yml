# TEMPORARY (delete before merging): checks this branch on Windows and walks through it like a new user,
# before (main) and after, saving the pictures to the "newuser-results" branch.
name: New user run

on:
  push:
    branches: [claude/project-thread-6xyzqi]

permissions:
  contents: write

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        shell: pwsh
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Checks
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          ruff check corefold scripts *> shots/ruff.txt
          python scripts/check_translations.py *> shots/translations.txt
          python -m pytest -q -p no:cacheprovider *> shots/pytest.txt
          Get-Content shots/ruff.txt, shots/translations.txt
          Get-Content shots/pytest.txt -Tail 15
      - name: Walk through like a new user (before and after)
        shell: pwsh
        continue-on-error: true
        run: |
          git worktree add ../before origin/main
          foreach ($combo in @("en dark", "en light", "ar dark", "ar light")) {
            $a = $combo -split " "
            python scripts/newusertest.py shots/after $a[0] $a[1] *>> shots/after-output.txt
            python scripts/newusertest.py shots/before $a[0] $a[1] --root ../before *>> shots/before-output.txt
          }
          Get-Content shots/after-output.txt
          Get-Content shots/before-output.txt | Select-String "pictures|SLOW|Error"
      - name: Side by side
        shell: pwsh
        continue-on-error: true
        run: |
          @'
          from pathlib import Path
          from PIL import Image, ImageChops, ImageDraw
          out = Path("shots/pairs"); out.mkdir(exist_ok=True)
          changed = []
          for a in sorted(Path("shots/after").glob("*.png")):
              b = Path("shots/before") / a.name
              if not b.exists():
                  continue
              ia, ib = Image.open(a).convert("RGB"), Image.open(b).convert("RGB")
              if ia.size == ib.size and ImageChops.difference(ia, ib).getbbox() is None:
                  continue
              changed.append(a.name)
              h = max(ia.height, ib.height)
              pair = Image.new("RGB", (ia.width + ib.width + 24, h + 34), (128, 128, 128))
              pair.paste(ib, (0, 34)); pair.paste(ia, (ib.width + 24, 34))
              d = ImageDraw.Draw(pair)
              d.text((10, 10), "BEFORE", fill=(255, 255, 255)); d.text((ib.width + 34, 10), "AFTER", fill=(255, 255, 255))
              pair.save(out / a.name)
          Path("shots/changed.txt").write_text("\n".join(changed))
          print(len(changed), "changed")
          '@ | python -
      - name: Save the pictures
        if: always()
        shell: pwsh
        run: |
          Set-Location shots
          git init -q -b newuser-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "New user run of $env:GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" newuser-results
