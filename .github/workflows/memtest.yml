# How much memory Rakiza Core holds step by step on a real Windows PC (one of GitHub's), and what it keeps once the
# window and a Space map are let go: scripts/memtest.py. Runs when the test changes, and by hand. The numbers show on
# the run's summary page and on the "memtest-results" branch (replaced each run; it isn't part of the app).
name: Memory

on:
  push:
    paths:
      - scripts/memtest.py
      - .github/workflows/memtest.yml
  workflow_dispatch:
    inputs:
      survivors:
        description: "List what a Space look leaves alive (slower; the memory numbers aren't comparable)"
        type: boolean
        default: false

permissions:
  contents: write   # the numbers are saved to the "memtest-results" branch

concurrency:
  group: memtest-${{ github.ref }}-${{ inputs.survivors }}
  cancel-in-progress: true

jobs:
  memory:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install what the app needs
        shell: pwsh
        run: |
          python -m pip install --quiet -r requirements.txt
          New-Item -ItemType Directory -Force out | Out-Null
          python scripts/screenres.py 1920 1080 *>> out/screen.txt

      - name: Measure
        timeout-minutes: 30
        shell: pwsh
        env:
          MEMTEST_SPACE: C:\Program Files
          MEMTEST_SURVIVORS: ${{ inputs.survivors && '1' || '' }}
        run: |
          python scripts/memtest.py out en dark *> out/memtest-run.txt
          Write-Host "memtest ended with $LASTEXITCODE"
          Get-Content out/memtest-run.txt | Select-Object -Last 60
          if (Test-Path out/memtest.md) {
            Get-Content out/memtest.md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }

      - name: Save the numbers to the memtest-results branch
        if: always()
        shell: pwsh
        env:
          MEMTEST_SURVIVORS: ${{ inputs.survivors && '1' || '' }}
        run: |
          Set-Location out
          $branch = if ($env:MEMTEST_SURVIVORS) { "memtest-results-survivors" } else { "memtest-results" }
          git init -q -b $branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Measured $env:GITHUB_SHA on $env:GITHUB_REF_NAME"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" $branch
