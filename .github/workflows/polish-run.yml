# Temporary: runs every check and takes every picture on each push to this branch. Removed before merging.
name: Polish run

on:
  push:
    branches: [claude/project-thread-b544zh]

permissions:
  contents: write

concurrency:
  group: polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  all:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --quiet -r requirements.txt
          choco install ffmpeg -y --no-progress | Out-Null
          New-Item -ItemType Directory -Force shots | Out-Null
      - name: Translations
        continue-on-error: true
        shell: pwsh
        run: python scripts/check_translations.py 2>&1 | Tee-Object shots/translations.txt
      - name: selftest
        continue-on-error: true
        shell: pwsh
        run: |
          $env:PATH = "$env:ProgramFiles\7-Zip;$env:PATH"
          python scripts/selftest.py 2>&1 | Tee-Object shots/selftest.txt
      - name: stress
        continue-on-error: true
        shell: pwsh
        run: |
          $env:PATH = "$env:ProgramFiles\7-Zip;$env:PATH"
          python scripts/stress.py shots 2>&1 | Tee-Object shots/stress-output.txt
      - name: uitest
        timeout-minutes: 10
        continue-on-error: true
        shell: pwsh
        run: |
          $env:PATH = "$env:ProgramFiles\7-Zip;$env:PATH"
          python scripts/uitest.py shots 2>&1 | Tee-Object shots/uitest-output.txt
      - name: screenshots
        continue-on-error: true
        shell: pwsh
        run: |
          foreach ($combo in @("dark en", "light en", "dark ar", "light ar")) {
            $a = $combo -split " "
            python scripts/screenshots.py shots $a[0] $a[1] 2>&1 | Tee-Object -Append shots/output.txt
          }
          Get-ChildItem shots/*-log.txt | ForEach-Object { "== $($_.Name)"; Get-Content $_ }
      - name: Save to the polish-shots branch
        if: always()
        shell: pwsh
        run: |
          Set-Location shots
          git init -q -b polish-shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Polish run of $env:GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" polish-shots
