name: Probe glyphs
on:
  push:
    branches: [claude/project-thread-csm4ok]
    paths: [scripts/glyphcheck.py, .github/workflows/probe-glyphs.yml]
jobs:
  glyphs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet -r requirements.txt
      - run: python scripts/glyphcheck.py
        env:
          GLYPH_TRY: "×►◄▼▲│|⋆∗✱☼♦♥√↔↑↓⇄⟲↺⟳•·◦▸▹›‹»«"
