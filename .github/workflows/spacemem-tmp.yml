# TEMPORARY (deleted before merge): Space look memory, 2.0.0 against this branch, on a real Windows PC.
name: Space memory (temporary)

on:
  push:
    branches: [claude/project-thread-w98338]
    paths: [corefold/space.py, scripts/spacememtest.py, .github/workflows/spacemem-tmp.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mem:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --quiet -r requirements.txt
          git worktree add old 97c74b7
      - name: Measure
        shell: pwsh
        run: |
          foreach ($round in 1, 2) {
            python scripts/spacememtest.py old C:\
            python scripts/spacememtest.py . C:\
          }
