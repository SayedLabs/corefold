name: Probe organizer
on:
  push:
    branches: [claude/project-thread-csm4ok]
    paths: [scripts/usetest.py, corefold/organizerpage.py, corefold/app.py, corefold/work.py, .github/workflows/probe-organizer.yml]
jobs:
  heavy:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4]
    env:
      COREFOLD_WAKE_RESTING: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --quiet -r requirements.txt
          python scripts/screenres.py 1920 1080
      - run: |
          git fetch -q --depth 1 origin +refs/heads/ffmpeg-lean:refs/remotes/origin/ffmpeg-lean
          git archive --format=zip -o ffmpeg-lean.zip refs/remotes/origin/ffmpeg-lean
          Expand-Archive ffmpeg-lean.zip vendor\ffmpeg -Force
      - run: |
          choco install ffmpeg -y --no-progress | Out-Null
          $env:PATH = "$env:ProgramFiles\7-Zip;$env:PATH"
          python scripts/usetest.py out --heavy --lang en --look dark --only start,organizer *> usetest.txt
          Get-Content usetest.txt -Tail 80
          exit 0
