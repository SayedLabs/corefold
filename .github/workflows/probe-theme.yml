name: Probe theme
on:
  push:
    branches: [claude/project-thread-csm4ok]
    paths: [corefold/sheet.py, corefold/app.py, .github/workflows/probe-theme.yml]
jobs:
  theme:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        code: [main, branch]
        run: [1, 2, 3]
    env:
      COREFOLD_WAKE_RESTING: 1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --quiet -r requirements.txt
          python scripts/screenres.py 1920 1080
      - if: matrix.code == 'main'
        run: git checkout origin/main -- corefold
      - run: |
          choco install ffmpeg -y --no-progress | Out-Null
          python scripts/usetest.py out --lang ar --look light --only start *> usetest.txt
          Select-String -Path usetest.txt -Pattern "switch|every page|^usetest"
          Get-Content out/ar-light-profile-theme.txt -TotalCount 25
          exit 0
