# TEMPORARY (delete before the pull request is merged): tries Corefold File Organizer on real Windows PCs on
# every push to its branch. What it found goes to the "organizer-results" branch, summary.txt on top.
name: File Organizer run

on:
  push:
    branches: [claude/project-thread-jm54a8]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: organizer-run
  cancel-in-progress: true

jobs:
  try:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: en-dark
            lang: en
            look: dark
          - name: ar-light
            lang: ar
            look: light
          - name: fr-dark-150
            lang: fr
            look: dark
            scale: "1.5"
          - name: tr-light-small
            lang: tr
            look: light
            size: min
          - name: es-dark-200
            lang: es
            look: dark
            scale: "2"
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install what the app needs
        shell: pwsh
        run: |
          python -m pip install --quiet -r requirements.txt
          New-Item -ItemType Directory -Force out | Out-Null
          python scripts/screenres.py 1920 1080 *>> out/screen.txt

      - name: Translations
        if: matrix.name == 'en-dark'
        shell: pwsh
        continue-on-error: true
        run: python scripts/check_translations.py *> out/translations.txt

      - name: The scenario test
        shell: pwsh
        continue-on-error: true
        env:
          QT_SCALE_FACTOR: ${{ matrix.scale }}
        run: |
          if (-not $env:QT_SCALE_FACTOR) { Remove-Item Env:QT_SCALE_FACTOR }
          python scripts/organizetest.py out/organizetest ${{ matrix.lang }} ${{ matrix.look }} *> out/organizetest.txt

      - name: Every button on the page, and the Store
        timeout-minutes: 25
        shell: pwsh
        continue-on-error: true
        env:
          QT_SCALE_FACTOR: ${{ matrix.scale }}
          SIZE: ${{ matrix.size }}
        run: |
          if (-not $env:QT_SCALE_FACTOR) { Remove-Item Env:QT_SCALE_FACTOR }
          $size = if ($env:SIZE) { $env:SIZE } else { "1040x700" }
          python scripts/sweeptest.py out/sweep --lang ${{ matrix.lang }} --look ${{ matrix.look }} --size $size --pages Organizer,Store,Home --rounds 2 *> out/sweep.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: organizer-${{ matrix.name }}
          path: out/

  results:
    needs: try
    if: ${{ !cancelled() }}  # (a run replaced by a newer push has nothing to sum up)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: results

      - name: Sum up and save to the organizer-results branch
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd results
          {
            echo "File Organizer run of $SHA"
            for d in */; do
              echo "== ${d%/}"
              grep -rhaE "^(organizetest|sweeptest)[^:]*: [0-9]+ problem|\[[a-z]{2}\] [0-9]+ texts" "$d" 2>/dev/null | head -20
              grep -rhaE "^(FAIL|ERROR) " "$d" 2>/dev/null | sort | uniq -c | sort -rn | head -60
            done
          } > summary.txt
          cat summary.txt
          git init -q -b organizer-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "File Organizer run of $SHA"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" organizer-results
