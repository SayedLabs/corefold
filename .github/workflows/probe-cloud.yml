# Temporary: Cloud pre-launch checks on Windows (removed before merging).
name: Cloud probe
on:
  push:
    branches: [claude/project-thread-xreoj7]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - shell: pwsh
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Old sign-in catcher could be taken over (reuse the address)
        shell: pwsh
        run: |
          @'
          import http.server, socket
          old = http.server.HTTPServer(("127.0.0.1", 0), http.server.BaseHTTPRequestHandler)
          port = old.server_address[1]
          s = socket.socket(); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          try:
              s.bind(("127.0.0.1", port)); s.listen(1); print("OLD: another socket took the port:", port)
          except OSError as e:
              print("OLD: refused", e)
          from corefold import cloud
          new = cloud._listen(0); port = new.server_address[1]
          s2 = socket.socket(); s2.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          try:
              s2.bind(("127.0.0.1", port)); print("NEW: another socket took the port (BAD)")
          except OSError as e:
              print("NEW: refused", e)
          d = cloud._listen(cloud.DROPBOX_PORT); d.server_close()
          d = cloud._listen(cloud.DROPBOX_PORT); d.server_close(); print("Dropbox port opens twice: OK")
          '@ | python -
      - name: Cloud tests
        if: always()
        shell: pwsh
        run: |
          python -m pytest -q tests/test_cloud_prelaunch.py tests/test_cloud_copy.py tests/test_cloud_share.py tests/test_review_cloud.py
          python scripts/newtest_cloud.py out/nt
