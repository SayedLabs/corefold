# Takes a picture of every screen on a real Windows PC (one of GitHub's), to check the design.
# Run it by hand: Actions tab -> "Screenshots" -> Run workflow. The pictures are in the run's Artifacts
# and on the "screenshots" branch (replaced on every run; it isn't part of the app).
name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write   # the pictures are saved to the "screenshots" branch

jobs:
  screenshots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install what the app needs
        shell: pwsh
        run: python -m pip install --quiet -r requirements.txt

      - name: Check archives and video on Windows
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          choco install ffmpeg -y --no-progress | Out-Null
          & "$env:ProgramFiles\7-Zip\7z.exe" | Select-Object -First 2 | Out-File -Encoding utf8 shots/selftest.txt
          $env:PATH = "$env:ProgramFiles\7-Zip;$env:PATH"
          python scripts/selftest.py *>> shots/selftest.txt

      - name: Time a very big archive
        shell: pwsh
        continue-on-error: true
        run: |
          $env:PATH = "$env:ProgramFiles\7-Zip;$env:PATH"
          python scripts/stress.py shots *>> shots/stress-output.txt

      - name: Take the pictures
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          foreach ($combo in @("dark en", "light en", "dark ar")) {
            $a = $combo -split " "
            python scripts/screenshots.py shots $a[0] $a[1] *>> "shots/output.txt"
          }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: shots/

      - name: Save the pictures to the screenshots branch
        if: always()
        shell: pwsh
        run: |
          Set-Location shots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots of $env:GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" screenshots
