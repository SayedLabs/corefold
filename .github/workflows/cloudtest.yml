# (temporary, removed before merging) Corefold Cloud tried on real Windows on every push to this branch.
name: Cloud test

on:
  push:
    branches: [claude/project-thread-692vcr]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  try:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --quiet -r requirements.txt
          New-Item -ItemType Directory -Force out | Out-Null
          python scripts/screenres.py 1920 1080 *>> out/screen.txt
      - name: Translations
        shell: pwsh
        run: python scripts/check_translations.py *> out/translations.txt; Get-Content out/translations.txt -Tail 8
      - name: Cloud
        shell: pwsh
        run: python scripts/newtest_cloud.py out/cloud *> out/cloud.txt; Get-Content out/cloud.txt
      - name: Self test
        shell: pwsh
        run: python scripts/selftest.py *> out/selftest.txt; Get-Content out/selftest.txt -Tail 15
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cloud
          path: out

  results:
    needs: try
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: results
      - name: Save to the cloudtest-results branch
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd results
          git init -q -b cloudtest-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Cloud test of $SHA"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" cloudtest-results
