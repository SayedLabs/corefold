# How smooth Corefold feels on a real Windows PC (one of GitHub's): scripts/smoothtest.py opens every page,
# scrolls, resizes, switches light and dark and the language, shows a question and a menu, and notes every
# moment the window couldn't draw, with where the time went. Runs when the app's code changes, and by hand.
name: Smoothness

on:
  push:
    paths:
      - corefold/**
      - scripts/smoothtest.py
      - .github/workflows/smoothtest.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoothtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smooth:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: en
            look: dark
          - lang: ar
            look: light
    name: ${{ matrix.lang }}-${{ matrix.look }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install what the app needs
        shell: pwsh
        run: |
          python -m pip install --quiet -r requirements.txt
          New-Item -ItemType Directory -Force out | Out-Null
          python scripts/screenres.py 1920 1080 *>> out/screen.txt

      - name: Measure
        timeout-minutes: 30
        shell: pwsh
        run: |
          python scripts/smoothtest.py out ${{ matrix.lang }} ${{ matrix.look }} *> out/smoothtest-run.txt
          Write-Host "smoothtest ended with $LASTEXITCODE"
          Get-Content out/smoothtest-run.txt | Select-String -NotMatch "^ok "
          if (Test-Path out/smoothtest.md) {
            Get-Content out/smoothtest.md
            Get-Content out/smoothtest.md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }
          $found = if (Test-Path out/smoothtest-result.txt) { [int](Get-Content out/smoothtest-result.txt) } else { 1 }
          if ($found -ne 0) { exit 1 }
          exit 0

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoothtest-${{ matrix.lang }}-${{ matrix.look }}
          path: out/
