# TEMPORARY probe (removed before merging): the new write-failure test alone, on Windows, to read it quickly.
name: Probe write failures

on:
  push:
    branches: [claude/project-thread-csm4ok]
    paths: [.github/workflows/probe-writefail.yml, scripts/writefailtest.py, scripts/fulldisktest.py]

permissions:
  contents: read

jobs:
  try:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        case: [read-only, locked, long, cancel]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --quiet -r requirements.txt
          choco install ffmpeg -y --no-progress | Out-Null
      - name: Write failures
        shell: pwsh
        run: |
          $env:PATH = "$env:ProgramFiles\7-Zip;$env:PATH"
          python scripts/writefailtest.py ${{ matrix.case }} 2>&1 | Select-String -Pattern 'PROBLEM|problem\(s\)|tools tried|^note|organizer'
          exit 0
