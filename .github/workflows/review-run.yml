# TEMPORARY (review thread): checks on Windows on each push to this branch. Removed before merging.
name: Review run

on:
  push:
    branches: [claude/project-thread-bjheix]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  try:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: use-en-dark-1
          - name: use-en-dark-2
          - name: scan-once
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --quiet -r requirements.txt
          New-Item -ItemType Directory -Force out | Out-Null
          python scripts/screenres.py 1920 1080 *>> out/screen.txt
          choco install ffmpeg -y --no-progress | Out-Null

      - name: Timed real use
        if: startsWith(matrix.name, 'use-')
        shell: pwsh
        continue-on-error: true
        run: |
          $env:PATH = "$env:ProgramFiles\7-Zip;$env:PATH"
          python scripts/usetest.py out/usetest --lang en --look dark *> out/usetest.txt

      - name: Scan, then organizer and startup like the bug hunt's tools job
        if: matrix.name == 'scan-once'
        shell: pwsh
        continue-on-error: true
        run: |
          foreach ($t in "organizetest", "startuptest") {
            python scripts/$t.py out/$t en dark *> "out/$t-en.txt"
            python scripts/$t.py out/$t ar light *> "out/$t-ar.txt"
          }
          python scripts/scantest.py out/scantest ar light *> out/scantest.txt

      - name: Sum up
        shell: pwsh
        run: |
          Get-ChildItem out -Filter *.txt | ForEach-Object {
            "== $($_.Name)"
            Get-Content $_.FullName | Select-String -Pattern "problem|^FAIL|^ERROR|^SLOW|full screen|Traceback" | Select-Object -First 60 | ForEach-Object { $_.Line }
          }
