# Security checks on a real Windows PC (scripts/securitytest.py), with the Uninstaller's own checks
# (they move, back up and put back leftovers the way the administrator helper does) and the self-test
# (7-Zip and FFmpeg found the safe way). Runs when the parts it checks change, and by hand.
name: Security checks

on:
  push:
    paths:
      - corefold/uninstall.py
      - corefold/core.py
      - corefold/cloud.py
      - corefold/archives.py
      - scripts/securitytest.py
      - .github/workflows/security.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install what the app needs
        shell: pwsh
        run: python -m pip install --quiet -r requirements.txt

      - name: Security checks
        shell: pwsh
        run: python scripts/securitytest.py

      - name: Proof for the scan tool (temporary)
        if: always()
        shell: pwsh
        run: python scripts/poc_scan_cmd.py

      - name: Uninstaller checks
        if: always()
        shell: pwsh
        run: |
          $failed = $false
          foreach ($part in "kinds", "leftovers") {
            python scripts/uninstalltest.py $part
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Self-test (archives and video, with 7-Zip and FFmpeg from PATH)
        if: always()
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress | Out-Null
          $env:PATH = "$env:ProgramFiles\7-Zip;$env:PATH"
          python scripts/selftest.py

      - name: Translations
        if: always()
        shell: pwsh
        run: python scripts/check_translations.py
