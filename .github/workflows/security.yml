# Security checks on a real Windows PC (scripts/securitytest.py), with the Uninstaller's own checks
# (they move, back up and put back leftovers the way the administrator helper does), the self-test
# (7-Zip and FFmpeg found the safe way) and a look for known holes in the Python packages Corefold
# ships with. Runs when the parts it checks change, every Monday (new holes are found all the time),
# and by hand.
name: Security checks

on:
  push:
    paths:
      - corefold/uninstall.py
      - corefold/core.py
      - corefold/cloud.py
      - corefold/cloudlocal.py
      - corefold/archives.py
      - corefold/ipc.py
      - corefold/startup.py
      - corefold/unlock.py
      - corefold/space.py
      - corefold/player.py
      - corefold/safetext.py
      - corefold/mailview.py
      - corefold/updater.py
      - corefold/__init__.py
      - main.py
      - requirements.txt
      - scripts/securitytest.py
      - .github/workflows/security.yml
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install what the app needs
        shell: pwsh
        run: |
          python -m pip install --quiet -r requirements.txt
          choco install ffmpeg -y --no-progress | Out-Null

      - name: Known holes in the packages
        shell: pwsh
        run: |
          python -m pip install --quiet pip-audit
          python -m pip_audit -r requirements.txt --desc off

      - name: Security checks
        if: always()
        shell: pwsh
        run: python scripts/securitytest.py

      - name: Uninstaller checks
        if: always()
        shell: pwsh
        run: |
          $failed = $false
          foreach ($part in "kinds", "leftovers") {
            python scripts/uninstalltest.py $part
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Self-test (archives and video, with 7-Zip and FFmpeg from PATH)
        if: always()
        shell: pwsh
        run: |
          $env:PATH = "$env:ProgramFiles\7-Zip;$env:PATH"
          python scripts/selftest.py

      - name: Translations
        if: always()
        shell: pwsh
        run: python scripts/check_translations.py
