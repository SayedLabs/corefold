# Temporary: runs scripts/usetest.py on every push to this branch. Removed before merging.
name: Use test run

on:
  push:
    branches: [claude/project-thread-orn4sa]

permissions:
  contents: write

concurrency:
  group: use-run
  cancel-in-progress: true

jobs:
  use:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: en-dark
            args: "--lang en --look dark"
          - name: ar-light
            args: "--lang ar --look light"
          - name: scan-6
            scan: "6"
          - name: scan-16
            scan: "16"
          - name: scan-32
            scan: "32"
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --quiet -r requirements.txt
          choco install ffmpeg -y --no-progress | Out-Null
          New-Item -ItemType Directory -Force out | Out-Null
          python scripts/screenres.py 1920 1080 *>> out/screen.txt
      - name: Cold scan
        if: matrix.scan != ''
        shell: pwsh
        run: |
          if ("${{ matrix.scan }}" -eq "6") { python scripts/pdfbench.py "$env:TEMP\pdfbench" *>> out/fonts.txt }
          python scripts/scantime.py C:\Windows ${{ matrix.scan }} 90 *>> out/fonts.txt
          python scripts/scantime.py C:\Windows ${{ matrix.scan }} 90 *>> out/fonts.txt
          Get-Content out/fonts.txt
      - name: First font use
        if: matrix.scan == ''
        shell: pwsh
        continue-on-error: true
        run: |
          foreach ($f in @("css", "css-var", "css-segoe", "css-app", "css", "css-app")) {
            python scripts/fonttime.py "$f" *>> out/fonts.txt
          }
          Get-Content out/fonts.txt
      - name: Use every tool
        if: matrix.scan == ''
        timeout-minutes: 45
        shell: pwsh
        continue-on-error: true
        env:
          ARGS: ${{ matrix.args }}
        run: |
          $env:PATH = "$env:ProgramFiles\7-Zip;$env:PATH"
          python scripts/usetest.py out @($env:ARGS -split " ") *> out/usetest-run-${{ matrix.name }}.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: use-${{ matrix.name }}
          path: out/

  results:
    needs: use
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: results
      - name: Save to the usetest-results branch
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd results
          { echo "Use test of $SHA"; for d in */; do echo "== ${d%/}"; cat "$d/fonts.txt" 2>/dev/null; grep -rhaE "^(SLOW|FAIL|ERROR)|usetest .*problem" "$d" | head -80; done; } > summary.txt
          git init -q -b usetest-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Use test of $SHA"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" usetest-results
