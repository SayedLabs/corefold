name: Heavy run (temporary)

on:
  push:
    branches: [claude/project-thread-v18dx6]

permissions:
  contents: read

env:
  COREFOLD_WAKE_RESTING: "1"

concurrency:
  group: heavy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        name: [heavy, use-en-dark, files-tests]
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --quiet -r requirements.txt
          New-Item -ItemType Directory -Force out | Out-Null
          python scripts/screenres.py 1920 1080 *>> out/screen.txt
          git fetch -q --depth 1 origin +refs/heads/ffmpeg-lean:refs/remotes/origin/ffmpeg-lean
          if ($LASTEXITCODE -eq 0) {
            git archive --format=zip -o ffmpeg-lean.zip refs/remotes/origin/ffmpeg-lean
            Expand-Archive ffmpeg-lean.zip vendor\ffmpeg -Force
            Remove-Item ffmpeg-lean.zip
          }
          choco install ffmpeg -y --no-progress | Out-Null
          exit 0
      - name: Heavy use of the Files tools
        if: matrix.name == 'heavy'
        timeout-minutes: 70
        shell: pwsh
        continue-on-error: true
        run: |
          $env:PATH = "$env:ProgramFiles\7-Zip;$env:PATH"
          Get-PSDrive C | Format-Table -AutoSize | Out-String | Write-Host
          python scripts/usetest.py out/usetest --heavy --lang en --look dark *> out/usetest-heavy.txt
      - name: Every tool, real-size files
        if: matrix.name == 'use-en-dark'
        timeout-minutes: 45
        shell: pwsh
        continue-on-error: true
        run: |
          $env:PATH = "$env:ProgramFiles\7-Zip;$env:PATH"
          python scripts/usetest.py out/usetest --lang en --look dark *> out/usetest.txt
      - name: The Files tools' own tests
        if: matrix.name == 'files-tests'
        timeout-minutes: 60
        shell: pwsh
        continue-on-error: true
        run: |
          $env:PATH = "$env:ProgramFiles\7-Zip;$env:PATH"
          python scripts/check_translations.py *> out/translations.txt
          python scripts/pdftest.py out/pdf en dark *> out/pdftest-en.txt
          python scripts/pdftest.py out/pdf ar light *> out/pdftest-ar.txt
          python scripts/organizetest.py out/org en dark *> out/organizetest-en.txt
          python scripts/organizetest.py out/org ar light *> out/organizetest-ar.txt
          python scripts/newtest_cloud.py *> out/newtest_cloud.txt
          python scripts/newtest_unlock.py *> out/newtest_unlock.txt
          python scripts/stress.py out/stress *> out/stress.txt
          python scripts/selftest.py *> out/selftest.txt
          python scripts/edgetest.py *> out/edgetest.txt
          python -m pip install --quiet -r requirements-dev.txt
          python -m pytest -q tests *> out/pytest.txt
      - name: Results
        if: always()
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem out -Filter "*.txt") {
            Write-Host "=================== $($f.Name)"
            Get-Content $f.FullName | Select-String -Pattern "^(FAIL|ERROR|SLOW|ok|note)|problem|froze|  [0-9.]+ s  |passed|failed|Traceback" | ForEach-Object { $_.Line }
          }
          $bad = Select-String -Path out/*.txt -Pattern ": [1-9][0-9]* problem|^FAIL |[0-9]+ failed"
          if ($bad) { $bad | ForEach-Object { Write-Host "BAD: $($_.Filename): $($_.Line)" }; exit 1 }
