# Builds the Windows installer on GitHub's servers, only after the release checks pass (see "checks").
# The code is in this private repository; the downloads live in the public one (update-repo.txt),
# because every copy of Rakiza Core looks for its updates there. See RELEASING.md.
# - Run it by hand from the Actions tab and type a version (like 2.3.0) -> it checks, builds and puts a
#   DRAFT release with every file in the public repository. Open it there, check it, press Publish.
# - Run it without a version                                             -> a test build: download the
#   files from the run's "Artifacts" (nothing is published).
# - Publish a Release in this same repository (tag like v1.0.0)          -> the files get attached to it.
name: Build Rakiza Core

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 2.3.0 (leave empty for a test build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # The release gate: nothing is built or attached unless every check below passes on a real Windows PC.
  # (A release left without its installer is safe: Rakiza Core's updater only offers a release once its
  # installer and SHA256SUMS are there.)
  checks:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install what the checks need
        shell: pwsh
        run: |
          python -m pip install --quiet -r requirements-dev.txt
          choco install ffmpeg -y --no-progress | Out-Null

      - name: What's new in this version is written (English and Arabic), and every kept version's notes read
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name || inputs.version }}
        run: python scripts/release_notes_check.py $env:TAG

      - name: Known holes in the packages
        shell: pwsh
        run: |
          python -m pip install --quiet pip-audit
          python -m pip_audit -r requirements.txt --desc off

      - name: Security checks
        if: always()
        shell: pwsh
        run: python scripts/securitytest.py

      - name: Data-safety checks (crash-safe sorting, downloads, ZIP bombs, passwords, clipboard, Recycle Bin)
        if: always()
        shell: pwsh
        run: |
          $env:PATH = "$env:ProgramFiles\7-Zip;$env:PATH"
          $env:PYTHONIOENCODING = "utf-8"
          python scripts/audittest.py

      - name: Uninstaller checks
        if: always()
        shell: pwsh
        run: |
          $failed = $false
          foreach ($part in "kinds", "leftovers") {
            python scripts/uninstalltest.py $part
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Self-test, translations and the File Organizer
        if: always()
        shell: pwsh
        run: |
          $env:PATH = "$env:ProgramFiles\7-Zip;$env:PATH"
          $failed = @()
          python scripts/selftest.py; if ($LASTEXITCODE) { $failed += "selftest" }
          python scripts/check_translations.py; if ($LASTEXITCODE) { $failed += "translations" }
          python scripts/organizetest.py out/organizetest en dark; if ($LASTEXITCODE) { $failed += "organizetest" }
          if ($failed) { "FAILED: $failed"; exit 1 }

      - name: Files tools, resting sections, What's new and updates (pytest)
        if: always()
        shell: pwsh
        run: python -m pytest -q tests

      - name: PDF and its editor
        if: always()
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          $failed = @()
          python scripts/pdftest.py out/pdftest en dark; if ($LASTEXITCODE) { $failed += "pdftest" }
          python scripts/pdfedittest.py out/pdfedittest ar light; if ($LASTEXITCODE) { $failed += "pdfedittest" }
          if ($failed) { "FAILED: $failed"; exit 1 }

  windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build app, installer and portable zip
        id: build
        shell: pwsh
        env:  # passed as data, never pasted into the script
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.version }}
          RUN: ${{ github.run_number }}
        run: |
          $release = if ($env:EVENT -eq "release") { $env:TAG } else { "$env:INPUT".Trim() }
          if ($release) {
            $version = $release.TrimStart("vV")
            if ($version -notmatch '^\d{1,4}(\.\d{1,6}){1,3}$') { throw "Not a version: $release" }
            # -OldUpdaterCopy: copies from before 1.7.0 only update to a release that has it
            ./scripts/build.ps1 -Version $version -OldUpdaterCopy
            "version=$version" >> $env:GITHUB_OUTPUT
          } else {
            ./scripts/build.ps1 -Version "0.0.$($env:RUN)-dev"
          }
          "repo=$((Get-Content update-repo.txt -Raw).Trim())" >> $env:GITHUB_OUTPUT

      - name: The installer itself (installs, updates while a conversion runs, refuses a full folder, removes)
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress | Out-Null
          $env:PYTHONIOENCODING = "utf-8"
          python scripts/installertest.py dist\release out\installer

      - name: Updating keeps everything (from real older releases and the newest one people have, a custom folder, shortcuts, a cut-off update)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.build.outputs.version }}
          PUBLIC_REPO: ${{ steps.build.outputs.repo }}  # (never PUBLIC: that's Windows' own C:\Users\Public)
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          New-Item -ItemType Directory -Force old | Out-Null
          # the versions people are on: older ones (their releases are kept in this repository too), and
          # whichever release is newest in the public repository, where people get it (not this one)
          $versions = @("v1.9.0", "v1.11.0", "v1.12.1", "v1.13.0")
          foreach ($v in $versions) {
            gh release download $v -R $env:GITHUB_REPOSITORY -p "Corefold-Setup-*.exe" -D old --clobber  # keep-name (the old releases' installer name)
            if ($LASTEXITCODE) { throw "couldn't download $v" }
          }
          $from = $env:PUBLIC_REPO
          $latest = gh release view -R $from --json tagName -q .tagName
          if (-not $latest) {  # (none there yet: the newest one people have is still in this repository)
            $from = $env:GITHUB_REPOSITORY
            $latest = gh release view -R $from --json tagName -q .tagName
          }
          if ($latest -and $latest -ne $env:TAG -and $versions -notcontains $latest) {
            gh release download $latest -R $from -p "Corefold-Setup-*.exe" -D old --clobber  # keep-name (the old releases' installer name)
            if ($LASTEXITCODE) { "note: $latest has no installer yet (still being built), so it isn't tried" }
          }
          $old = Get-ChildItem old -Filter "Corefold-Setup-*.exe" | Sort-Object { [version]($_.BaseName -replace "Corefold-Setup-", "") } | ForEach-Object { $_.FullName }  # keep-name
          python scripts/upgradetest.py dist\release out\upgrade @old

      - name: Updates without Windows' question (the update task - who may change it, runs as SYSTEM, installs a checked release, starts Rakiza Core again, removed with it)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_REPO: ${{ steps.build.outputs.repo }}
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          python scripts/silentupdatetest.py dist\release out\silent

      - name: Every file is what was built (SHA256SUMS)
        shell: pwsh
        run: |
          $sums = Get-Content dist\release\SHA256SUMS.txt
          $bad = 0
          foreach ($line in $sums) {
            $hash, $name = $line -split '\s+\*?', 2
            if (-not $name) { continue }
            $real = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path dist\release $name)).Hash
            if ($real -ne $hash) { "MISMATCH $name"; $bad++ }
          }
          if ($bad) { exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: Rakiza Core
          path: dist/release/*

      # what the installer and update tests wrote (Setup's own logs too), when one of them failed
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Test logs
          path: out/
          if-no-files-found: ignore

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2, pinned: it gets write access
        with:
          files: dist/release/*

      # What's new, in English then Arabic, for the release page (the notes kept in assets/release-notes)
      - name: The release page's text
        if: github.event_name == 'workflow_dispatch' && steps.build.outputs.version != ''
        shell: pwsh
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: python scripts/release_body.py $env:VERSION dist\release-body.md

      # A draft in the public repository: nobody sees it, and no copy updates to it, until it's published.
      # PUBLIC_RELEASE_TOKEN: a fine-grained token with "Contents: read and write" on that repository only.
      - name: Draft the release in the public repository
        if: github.event_name == 'workflow_dispatch' && steps.build.outputs.version != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2, pinned: it gets write access
        with:
          repository: ${{ steps.build.outputs.repo }}
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          tag_name: v${{ steps.build.outputs.version }}
          target_commitish: main
          name: Rakiza Core ${{ steps.build.outputs.version }}
          body_path: dist/release-body.md
          draft: true
          files: dist/release/*
