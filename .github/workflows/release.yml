# Builds the Windows installer on GitHub's servers, only after the release checks pass (see "checks").
# - Publish a Release on GitHub (tag like v1.0.0)  -> installer + portable zip get attached to it.
# - Or run it by hand from the Actions tab           -> download the files from the run's "Artifacts".
name: Build Corefold

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The release gate: nothing is built or attached unless every check below passes on a real Windows PC.
  # (A release left without its installer is safe: Corefold's updater only offers a release once its
  # installer and SHA256SUMS are there.)
  checks:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install what the checks need
        shell: pwsh
        run: |
          python -m pip install --quiet -r requirements-dev.txt
          choco install ffmpeg -y --no-progress | Out-Null

      - name: What's new in this version is written (English and Arabic), and every kept version's notes read
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python scripts/release_notes_check.py $env:TAG

      - name: Known holes in the packages
        shell: pwsh
        run: |
          python -m pip install --quiet pip-audit
          python -m pip_audit -r requirements.txt --desc off

      - name: Security checks
        if: always()
        shell: pwsh
        run: python scripts/securitytest.py

      - name: Data-safety checks (crash-safe sorting, downloads, ZIP bombs, passwords, clipboard, Recycle Bin)
        if: always()
        shell: pwsh
        run: |
          $env:PATH = "$env:ProgramFiles\7-Zip;$env:PATH"
          $env:PYTHONIOENCODING = "utf-8"
          python scripts/audittest.py

      - name: Uninstaller checks
        if: always()
        shell: pwsh
        run: |
          $failed = $false
          foreach ($part in "kinds", "leftovers") {
            python scripts/uninstalltest.py $part
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Self-test, translations and the File Organizer
        if: always()
        shell: pwsh
        run: |
          $env:PATH = "$env:ProgramFiles\7-Zip;$env:PATH"
          $failed = @()
          python scripts/selftest.py; if ($LASTEXITCODE) { $failed += "selftest" }
          python scripts/check_translations.py; if ($LASTEXITCODE) { $failed += "translations" }
          python scripts/organizetest.py out/organizetest en dark; if ($LASTEXITCODE) { $failed += "organizetest" }
          if ($failed) { "FAILED: $failed"; exit 1 }

      - name: Files tools, resting sections, What's new and updates (pytest)
        if: always()
        shell: pwsh
        run: python -m pytest -q tests

      - name: PDF and its editor
        if: always()
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          $failed = @()
          python scripts/pdftest.py out/pdftest en dark; if ($LASTEXITCODE) { $failed += "pdftest" }
          python scripts/pdfedittest.py out/pdfedittest ar light; if ($LASTEXITCODE) { $failed += "pdfedittest" }
          if ($failed) { "FAILED: $failed"; exit 1 }

  windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build app, installer and portable zip
        shell: pwsh
        env:  # passed as data, never pasted into the script
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          RUN: ${{ github.run_number }}
        run: |
          if ($env:EVENT -eq "release") {
            # -OldUpdaterCopy: copies from before 1.7.0 only update to a release that has it
            ./scripts/build.ps1 -Version $env:TAG -OldUpdaterCopy
          } else {
            ./scripts/build.ps1 -Version "0.0.$($env:RUN)-dev"
          }

      - name: The installer itself (installs, updates while a conversion runs, refuses a full folder, removes)
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress | Out-Null
          $env:PYTHONIOENCODING = "utf-8"
          python scripts/installertest.py dist\release out\installer

      - name: Updating keeps everything (from real older releases and the newest one people have, a custom folder, shortcuts, a cut-off update)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          New-Item -ItemType Directory -Force old | Out-Null
          # the versions people are on: older ones, and whichever release is newest on GitHub (not this one)
          $versions = @("v1.9.0", "v1.11.0", "v1.12.1", "v1.13.0")
          $latest = gh release view -R $env:GITHUB_REPOSITORY --json tagName -q .tagName
          if ($latest -and $latest -ne $env:TAG -and $versions -notcontains $latest) { $versions += $latest }
          foreach ($v in $versions) {
            gh release download $v -R $env:GITHUB_REPOSITORY -p "Corefold-Setup-*.exe" -D old --clobber
            if ($LASTEXITCODE) { throw "couldn't download $v" }
          }
          $old = Get-ChildItem old -Filter "Corefold-Setup-*.exe" | Sort-Object { [version]($_.BaseName -replace "Corefold-Setup-", "") } | ForEach-Object { $_.FullName }
          python scripts/upgradetest.py dist\release out\upgrade @old

      - name: Every file is what was built (SHA256SUMS)
        shell: pwsh
        run: |
          $sums = Get-Content dist\release\SHA256SUMS.txt
          $bad = 0
          foreach ($line in $sums) {
            $hash, $name = $line -split '\s+\*?', 2
            if (-not $name) { continue }
            $real = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path dist\release $name)).Hash
            if ($real -ne $hash) { "MISMATCH $name"; $bad++ }
          }
          if ($bad) { exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: Corefold
          path: dist/release/*

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2, pinned: it gets write access
        with:
          files: dist/release/*
