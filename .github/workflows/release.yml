# Builds the Windows installer on GitHub's servers.
# - Publish a Release on GitHub (tag like v1.0.0)  -> installer + portable zip get attached to it.
# - Or run it by hand from the Actions tab           -> download the files from the run's "Artifacts".
name: Build Corefold

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build app, installer and portable zip
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "release") { "${{ github.event.release.tag_name }}" } else { "0.0.${{ github.run_number }}-dev" }
          ./scripts/build.ps1 -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: Corefold
          path: dist/release/*

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
