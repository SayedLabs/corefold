# Temporary (removed before the pull request): Arabic before/after on a real Windows PC.
name: Arabic before and after

on:
  push:
    branches: [claude/project-thread-p42991]

permissions:
  contents: write

env:
  COREFOLD_WAKE_RESTING: "1"

jobs:
  shots:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: before
            ref: main
          - name: after
            ref: ${{ github.sha }}
          - name: after-small
            ref: ${{ github.sha }}
            size: min
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --quiet -r requirements.txt
          New-Item -ItemType Directory -Force out | Out-Null
          python scripts/screenres.py 1920 1080 *>> out/screen.txt
      - name: Every page in Arabic (cut text, things sticking out)
        timeout-minutes: 40
        shell: pwsh
        continue-on-error: true
        run: |
          $size = "${{ matrix.size }}"
          if (-not $size) { $size = "1040x700" }
          python scripts/sweeptest.py out/sweep --lang ar --look light --size $size --quick *> out/sweep.txt
      - name: Like someone new, in Arabic
        if: matrix.size == ''
        timeout-minutes: 15
        shell: pwsh
        continue-on-error: true
        run: python scripts/newusertest.py out/newuser ar light *> out/newuser.txt
      - name: Pictures of every screen in Arabic
        if: matrix.size == ''
        timeout-minutes: 15
        shell: pwsh
        continue-on-error: true
        run: python scripts/screenshots.py out/shots light ar *> out/shots.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ar-${{ matrix.name }}
          path: out/

  save:
    needs: shots
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: results
      - name: Save to the arabic-shots-results branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cd results
          git init -q -b arabic-shots-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Arabic before/after of $GITHUB_SHA"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" arabic-shots-results
