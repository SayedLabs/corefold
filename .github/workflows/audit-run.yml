# Temporary (delete before merge): runs this branch's checks on Windows on every push.
name: Audit run

on:
  push:
    branches: [claude/project-thread-81oap4]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        shell: pwsh
        run: python -m pip install --quiet -r requirements.txt
      - name: audittest
        shell: pwsh
        run: |
          $env:PATH = "$env:ProgramFiles\7-Zip;$env:PATH"
          $env:PYTHONIOENCODING = "utf-8"
          python scripts/audittest.py

  regressions:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --quiet -r requirements.txt
          choco install ffmpeg -y --no-progress | Out-Null
      - name: The tools' own tests
        shell: pwsh
        run: |
          $env:PATH = "$env:ProgramFiles\7-Zip;$env:PATH"
          $env:PYTHONIOENCODING = "utf-8"
          $failed = @()
          function Code($n) { "== $n exit code: $LASTEXITCODE (0x{0:X8})" -f $LASTEXITCODE }
          python scripts/check_translations.py; if ($LASTEXITCODE) { $failed += "translations" }
          python scripts/organizetest.py out/organizetest en dark; Code organizetest; if ($LASTEXITCODE) { $failed += "organizetest" }
          python scripts/featuretest.py; if ($LASTEXITCODE) { $failed += "featuretest" }
          python scripts/edgetest.py; if ($LASTEXITCODE) { $failed += "edgetest" }
          foreach ($t in "newtest_cloud", "newtest_emptyfolders", "newtest_unlock", "newtest_basics") {
            python scripts/$t.py; Code $t; if ($LASTEXITCODE) { $failed += $t }
          }
          if ($failed) { "FAILED: $failed" }
          # the same two on main, to see if it was already so
          git fetch -q origin main
          git worktree add -q ..\main origin/main
          Push-Location ..\main
          python scripts/organizetest.py out/organizetest en dark; Code "main organizetest"
          python scripts/newtest_basics.py; Code "main newtest_basics"
          Pop-Location
          if ($failed) { exit 1 }

  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1 -Version 0.0.${{ github.run_number }}-audit
      - name: installertest
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress | Out-Null
          $env:PYTHONIOENCODING = "utf-8"
          python scripts/installertest.py dist\release out\installer
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: installer-logs
          path: out/
